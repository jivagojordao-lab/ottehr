services:
  postgres:
    image: postgres:16-alpine
    container_name: ottehr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medplum
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum -d medplum"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ottehr-redis
    restart: unless-stopped
    command: ["redis-server", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  medplum:
    image: medplum/medplum-server:latest
    container_name: ottehr-medplum
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MEDPLUM_BASE_URL: "http://localhost:8103/"
      MEDPLUM_PORT: 8103
      MEDPLUM_DATABASE_HOST: postgres
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_NAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: medplum_dev_password
      MEDPLUM_REDIS_HOST: redis
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REGISTER_ENABLED: "true"
    ports:
      - "8103:8103"
    volumes:
      - ./medplum.config.json:/usr/src/medplum/medplum.config.json
      - ./medplum.config.json:/usr/src/medplum/packages/server/medplum.config.json
      - medplumdata:/var/lib/medplum/data

networks:
  default:
    name: ottehr-net

volumes:
  pgdata:
  redisdata:
  medplumdata:
